name: Release completeness

on: [push, pull_request]

jobs:
  source-and-packages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Check tracked source and vendored checksums
        run: python scripts/check_release.py --check_git
      - name: Install build tools
        run: python -m pip install -c constraints.txt setuptools wheel
      - name: Build source and wheel distributions
        run: python setup.py sdist bdist_wheel
      - name: Verify distribution contents
        run: python scripts/check_release.py --dist dist/*.tar.gz dist/*.whl
